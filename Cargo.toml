[package]
name = "spot"
version = "0.1.0"
edition = "2024"

[dependencies]
librespot-core = "0.8.0"
librespot-playback = "0.8.0"
librespot-connect = "0.8.0"
librespot-oauth = "0.8.0"
rspotify = "0.16.1"
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
chrono = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
zune-jpeg = "0.5"
zune-core = "0.5"

[profile.release]
lto = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
