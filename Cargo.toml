[package]
name = "spot"
version = "1.5.0"
edition = "2024"
# ratatui 0.30 sets the real floor; the librespot crates need 1.85, as does
# edition 2024 itself.
rust-version = "1.88"
description = "A standalone Spotify player for the terminal"
license = "MIT"
repository = "https://github.com/ddmills/spot"
readme = "README.md"

[build-dependencies]
winresource = "0.1"

[dependencies]
librespot-core = "0.8.0"
librespot-playback = "0.8.0"
# Already in the tree under librespot-playback, which does not re-export it —
# `PlayerEvent::TrackChanged` carries an `AudioItem` and the deck reads it.
librespot-metadata = "0.8.0"
librespot-oauth = "0.8.0"
rspotify = "0.16.1"
# The queue's shuffle. Pinned to the 0.9 line librespot-playback already
# resolves, so only one copy is compiled.
rand = "0.9"
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
chrono = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
semver = "1"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
zune-jpeg = "0.5"
zune-core = "0.5"
# Internet radio, played by spot itself: these streams are ordinary HTTP audio
# and cannot go through the Connect device. rodio is pinned to the version
# librespot-playback already resolves so only one copy is compiled - it arrives
# here with its symphonia decoders switched on, which librespot does not use.
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3", "symphonia-aac"] }
# `stream-download` turns a live HTTP stream into the `Read + Seek` rodio's
# decoder needs; `icy-metadata` reads the StreamTitle Icecast servers
# interleave into it. Both build on reqwest 0.13 while rspotify still pins
# 0.12, so two copies of that one wrapper crate are compiled - hyper, h2,
# native-tls and tokio underneath it are shared.
stream-download = { version = "0.24.1", default-features = false, features = ["reqwest-native-tls"] }
icy-metadata = "0.6"

# Only for the double-click relaunch in src/relaunch.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
# One codegen unit and no symbols: the release build is a download, so the
# size and the extra inlining are both worth the slower link.
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
